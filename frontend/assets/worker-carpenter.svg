    <circle cx="340" cy="440" r="100" fill="#a07025" opacity="0.2"/>

    <!-- Body / torso (shirt) -->
    <ellipse cx="183" cy="430" rx="130" ry="80" fill="#16130f"/>
    <ellipse cx="183" cy="370" rx="100" ry="65" fill="#23201e"/>
    <!-- Neck -->
