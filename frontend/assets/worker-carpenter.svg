    <path d="M150 236 Q162 230 170 237" stroke="#5c544e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M196 237 Q204 230 216 236" stroke="#5c544e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Nose -->
