      <stop offset="100%" stop-color="#a07025"/>
    </radialGradient>
    <clipPath id="clip-worker-carpenter.svg">
      <rect width="366" height="488" rx="0"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip-worker-carpenter.svg)">
